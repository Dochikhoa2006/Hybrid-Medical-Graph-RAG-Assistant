name: Feature request
description: Propose a focused engineering improvement to the educational prototype.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Keep proposals technically specific and within the project's educational scope. Do not include personal medical information.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What engineering or user-experience problem would this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Describe the behavior, trade-offs, and affected components.
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: How should the change be tested or measured?
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This proposal does not claim clinical validation or production readiness.
          required: true
        - label: This proposal contains no secrets or personal health information.
          required: true
